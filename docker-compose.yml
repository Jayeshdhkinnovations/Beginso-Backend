# Local development and QA: the API and its own MongoDB.   docker compose up --build   ->   http://localhost:5000/api/health
#
# Nothing here is a real credential. The API runs with NODE_ENV=development, so the Firebase key is not needed (the app uses a dummy one
# and warns) and the start-up check only warns. Real mail is not sent: SMTP points at a host that does not exist.
# For a server, use docker-compose.prod.yml instead.
name: beginso-backend-dev

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
        BUILD_TIME: ${BUILD_TIME:-}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/onboarding
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-local-dev-only-change-me-too}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SMTP_HOST: smtp.invalid
      SMTP_PORT: "587"
      SMTP_USER: dev
      SMTP_PASS: dev
      SMTP_FROM_EMAIL: dev@example.invalid
      TRUST_PROXY_HOPS: "0"
    volumes:
      - uploads:/data
    stop_grace_period: 30s

volumes:
  mongo-data:
  uploads:
