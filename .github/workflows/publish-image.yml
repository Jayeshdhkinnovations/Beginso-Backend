name: Publish Docker Image

# Builds the backend image and pushes it to GitHub Container Registry as ghcr.io/<owner>/beginso-backend:sha-<7 characters of the commit>, plus the moving
# tag `main`. There is never a `latest` tag.
#
# Two ways it starts:
#   1. AUTOMATIC, after the `ci` workflow finishes green on a push to main. Only when the repository variable DOCKER_DEPLOY_ENABLED is 'true'.
#      It is the first step of the Docker deploy: ci -> Publish Docker Image -> Deploy Backend (Docker).
#   2. BY HAND (Actions -> Publish Docker Image -> Run workflow), at any time, whatever the variable says. It only builds and pushes an image:
#      it deploys nothing and touches no server, so it is safe before the cutover (the first test container needs an image to start).
#
# What it needs (the BACKEND REPO OWNER does this once):
#   - Settings -> Actions -> General -> Workflow permissions: "Read and write permissions" (the job asks for `packages: write` below).
#   - After the first publish: Packages -> beginso-backend -> Package settings -> link it to this repository and keep it PRIVATE.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (default: main)"
        required: false
        default: main

permissions:
  contents: read

jobs:
  publish:
    # By hand: always. Automatic: only when the Docker deploy is switched on AND ci was green on a push to main.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (vars.DOCKER_DEPLOY_ENABLED == 'true' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One build per commit; a newer commit does not cancel a build that is already pushing.
    concurrency:
      group: publish-image-${{ github.event.workflow_run.head_sha || inputs.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the commit
        uses: actions/checkout@v7
        with:
          # After ci: exactly the commit ci ran on (github.sha would be the head of main, which may already have moved on).
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false

      - name: Work out the tags
        id: tags
        run: |
          sha="$(git rev-parse HEAD)"
          repo="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]' | cut -d/ -f1)/beginso-backend"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "message=$(git log -1 --format=%s | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${repo}:sha-${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "main_tag=${repo}:main" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default Docker driver cannot export a build cache ("Cache export is not supported for the docker driver"). This sets up a buildx
      # builder that can, which the cache-from/cache-to lines below need.
      - name: Set up the image builder
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.main_tag }}
          build-args: |
            GIT_SHA=${{ steps.tags.outputs.sha }}
            GIT_MESSAGE=${{ steps.tags.outputs.message }}
            BUILD_TIME=${{ steps.tags.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
