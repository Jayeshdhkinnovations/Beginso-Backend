# A server: the API only. MongoDB stays where it is (Atlas, set by MONGODB_URI in the env file).
#
#   BACKEND_IMAGE=ghcr.io/<owner>/beginso-backend:sha-abc1234 docker compose -f docker-compose.prod.yml up -d
#
# Normally started through scripts/deploy-docker.sh, which also waits for the health check, checks the live commit and keeps the
# previous tag for a rollback. The image is always a TAG (BACKEND_IMAGE), never `latest`.
#
# Required on the host (see docs/DOCKER.md):
#   .env                         the settings, readable only by the deploy user (chmod 600)
#   UPLOADS_PATH                 a folder for /data (uploads, reports, exports); owned by uid 1000, the `node` user in the image
#   FIREBASE_KEY_PATH            the Firebase service-account key file, mounted read-only
# THE VM ALSO RUNS OTHER DOCKER CONTAINERS: everything this file creates is called beginso-api (project, container, network) and carries the
# label com.beginso.app=api, so it can be found, cleaned up and left alone by that name and label only. The project name is fixed here, not taken
# from the folder name, so no other compose project can ever be confused with it.
name: beginso-api

services:
  api:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to an image tag, for example ghcr.io/owner/beginso-backend:sha-abc1234}
    container_name: beginso-api
    labels:
      com.beginso.app: api
    networks:
      - default
    restart: unless-stopped
    env_file: ./.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      # `off` for the first test container (see docs/DOCKER.md): only ONE process may run the timers. `on` for the live one.
      BACKGROUND_JOBS: ${BACKGROUND_JOBS:-on}
    # The ONLY published port. The port is set by the ONE variable HOST_PORT (default 5000; the first test container uses 5001) and the address
    # by the ONE variable BIND_ADDRESS, which defaults to the loopback: reachable only from this machine, with a proxy on the same host in front.
    # On the Beginso VM nothing runs in front of the backend (no nginx, no Caddy): the live backend answers on port 5000 of every address, and
    # whatever forwards to it reaches it at the VM's address. There .deploy/env sets BIND_ADDRESS=0.0.0.0, which is exactly the exposure the pm2
    # backend has today, no more. The app trusts TRUST_PROXY_HOPS proxies for the client IP. scripts/deploy-docker.sh checks that the port is
    # free BEFORE it starts anything and never takes it from another container.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-5000}:5000"
    volumes:
      - ${UPLOADS_PATH:-./data}:/data
      - ${FIREBASE_KEY_PATH:?set FIREBASE_KEY_PATH to the Firebase service-account key file}:/app/dist/config/firebase/serviceAccountKey.json:ro

    # Hardening: the code is read-only, nothing can gain privileges, no Linux capability is needed to serve HTTP on 5000.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Sizing for THIS VM: it has about 2 GB in total and about 1.1 GB free beside the other containers (portainer, cadvisor, node_exporter,
    # promtail), and the live pm2 backend peaks near 120 MB. Peak plus 50 percent is about 180 MB; 768 MB is the floor of the rule in
    # docs/DOCKER.md section 6 and leaves room for a PDF report (they are generated inside this process). A limit above the free memory would
    # let a runaway container squeeze the others. Raise it only after watching `docker stats` for a week.
    mem_limit: 768m
    cpus: 1.5

    # A stop gives requests in flight up to 25 s (see src/utils/gracefulShutdown.ts); Docker waits 30 s before it kills.
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # The health check is the one built into the image (GET /api/health).

# Our own network, named and labelled, so it is not the shared default of the machine and `docker compose down` removes exactly this one.
networks:
  default:
    name: beginso-api
    labels:
      com.beginso.app: api
