name: ci

# Runs on every pull request to main and on every push to main. GitHub-hosted runner only: a pull request's code never runs on the
# self-hosted deploy machine. The one job is called "ci" so branch protection can require a single, stable check name.
#
# deploy.yml is separate and unchanged: it still runs its own type-check, lint and tests before it deploys. This workflow adds what
# deploy.yml does not do: it runs on pull requests (before anything is merged), it looks for conflict markers, and it builds.
on:
  pull_request:
    branches: [main]
  push:
    # feat/backend-docker: so the `docker` job runs on this branch before it is merged. Remove it with the merge.
    branches: [main, feat/backend-docker]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A merge once dropped an import and `main` stopped compiling; another committed unresolved conflict markers.
      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- . ':!*.md' ':!package-lock.json' ':!*.snap'; then
            echo "::error::Unresolved merge-conflict markers found (lines above). Resolve them and push again."
            exit 1
          fi
          echo "No conflict markers."

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Every suite starts its own in-memory MongoDB (mongodb-memory-server downloads the binary on first use), so no database
      # service is needed. Two workers: each one holds a mongod, and a private-repo runner has 2 CPUs and 7 GB of memory.
      - name: Tests
        run: npm test -- --maxWorkers=2

      - name: Build
        run: npm run build

  # Builds the Docker image, starts it next to a MongoDB, and proves it answers. Does not push anything and does not touch any server.
  # Report-only vulnerability scan: high and critical findings are listed, they do not fail the build yet.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Start MongoDB and wait until it answers
        run: |
          # A plain container and an explicit wait, not a service container: its health-check options failed to settle on the runner.
          docker run -d --label com.beginso.app=api --name beginso-api-ci-mongo --network host mongo:7
          for i in $(seq 1 30); do
            if docker exec beginso-api-ci-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; then echo "MongoDB is up"; exit 0; fi
            sleep 2
          done
          echo "::error::MongoDB did not answer in 60 s"; docker logs beginso-api-ci-mongo | tail -30; exit 1

      - name: This machine's other containers are safe (no unfiltered prune, fixed project names, loopback ports)
        run: ./scripts/check-docker-hygiene.sh

      - name: The pre-start port check refuses a port somebody else holds, and says so
        run: |
          python3 -m http.server 5099 --bind 127.0.0.1 >/dev/null 2>&1 &
          holder=$!
          sleep 2
          set +e
          out="$(HOST_PORT=5099 ./scripts/deploy-docker.sh check-port 2>&1)"; code=$?
          kill "$holder"
          echo "$out"
          test "$code" -eq 3
          echo "$out" | grep -q "ALREADY IN USE"
          echo "$out" | grep -q "Nothing was stopped"
          set -e
          HOST_PORT=5098 ./scripts/deploy-docker.sh check-port   # a free port passes

      - name: Build the image (no cache)
        run: |
          docker build --no-cache \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t beginso-api:ci .
          docker image ls beginso-api:ci --format 'image size: {{.Size}}'

      - name: Runs as a non-root user, with no secret in the layers
        run: |
          # the marker that cleanup on a shared machine filters by
          test "$(docker image inspect --format '{{ index .Config.Labels "com.beginso.app" }}' beginso-api:ci)" = "api"
          test "$(docker run --rm --entrypoint id beginso-api:ci -u)" != "0"
          docker history --no-trunc beginso-api:ci > history.txt
          docker inspect beginso-api:ci > inspect.txt
          # The only build-time values are the commit id and the build time. None of the names a secret travels under may appear with a value.
          if grep -E '(JWT_SECRET|MONGODB_URI|SMTP_PASS|PROXY_SHARED_SECRET|AUTH_EMAIL_HASH_PEPPER|DKIM_PRIVATE_KEY|SUPER_ADMIN_PASSWORD)=[^ ]' history.txt inspect.txt; then
            echo "::error::a secret name with a value is stored in the image"; exit 1
          fi
          if docker run --rm --entrypoint sh beginso-api:ci -c 'find / -name "serviceAccountKey*.json" -not -path "/proc/*" 2>/dev/null | grep .'; then
            echo "::error::a Firebase key file is inside the image"; exit 1
          fi

      - name: Refuses to start in production without a required setting (names it, never a value)
        run: |
          set +e
          out="$(docker run --rm -e NODE_ENV=production beginso-api:ci 2>&1)"; code=$?
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "JWT_SECRET is missing"

      - name: Start it next to MongoDB and wait for the health check
        run: |
          docker run -d --label com.beginso.app=api --name beginso-api-ci --network host \
            -e NODE_ENV=development -e PORT=5000 \
            -e MONGODB_URI=mongodb://127.0.0.1:27017/ci \
            -e JWT_SECRET=ci-only-not-a-secret -e PROXY_SHARED_SECRET=ci-only-not-a-secret \
            -e APP_URL=http://localhost:3000 -e TRUST_PROXY_HOPS=0 \
            beginso-api:ci
          chmod +x scripts/docker-wait.sh
          ./scripts/docker-wait.sh http://127.0.0.1:5000/api/health 90 || { docker logs beginso-api-ci; exit 1; }

      - name: The health route and the root route report this commit, and one API route answers
        run: |
          short="${GITHUB_SHA:0:7}"
          curl -fsS http://127.0.0.1:5000/api/health | grep -q "$short"
          curl -fsS http://127.0.0.1:5000/ | grep -q "$short"
          # no token: the API must answer 401, not crash
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/auth/me)" = "401"

      - name: A wrong health path must fail (this check breaks something on purpose)
        run: |
          if ./scripts/docker-wait.sh http://127.0.0.1:5000/api/this-route-does-not-exist 6; then
            echo "::error::the health check passed for a path that does not exist"; exit 1
          fi
          echo "good: the wrong path was reported as unhealthy"

      - name: Uploads survive a new container
        run: |
          docker volume create --label com.beginso.app=api beginso-api-ci-data
          docker run --rm -v beginso-api-ci-data:/data --user 0 --entrypoint sh beginso-api:ci -c 'chown -R node:node /data && echo proof > /data/uploads/proof.txt'
          docker run --rm -v beginso-api-ci-data:/data --entrypoint cat beginso-api:ci /data/uploads/proof.txt | grep -q proof

      - name: A stop is graceful (exit code 0, well inside the grace time)
        run: |
          start=$SECONDS
          docker stop -t 30 beginso-api-ci
          test "$(docker inspect beginso-api-ci --format '{{.State.ExitCode}}')" = "0"
          test $((SECONDS - start)) -lt 20

      # Report only: high and critical findings are listed, they never fail the build (continue-on-error, and it is the last step, so
      # nothing depends on it). Pinned to the commit of the release tag v0.36.0 (a tag name alone can be moved; the tag needs the "v").
      - name: Vulnerability scan (report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: beginso-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
