name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  # Tests run on a GitHub-hosted runner, not on the production server: each suite boots its
  # own in-memory mongod and the full run OOM-killed the self-hosted runner (run #127).
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint (errors fail, warnings do not)
        run: npm run lint

      - name: Run Tests
        run: npm test

  deploy:
    needs: test
    # The pm2 deploy runs only while the Docker deploy is NOT switched on. The repository variable DOCKER_DEPLOY_ENABLED ('true' turns the Docker
    # deploy on, see deploy-docker.yml and docs/DOCKER.md) decides, and exactly one of the two backend deploys can ever run: unset or anything
    # else means this one, as it always was.
    if: ${{ vars.DOCKER_DEPLOY_ENABLED != 'true' }}
    runs-on: self-hosted
    # Shared with the Docker deploy: two backend deploys never overlap, even at the moment the variable is flipped.
    concurrency:
      group: backend-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Code
        run: npm run build

      - name: Copy Firebase Assets
        run: node copyAssets.js

      - name: Write Version File
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          node -e "const fs=require('fs');const sha=process.env.COMMIT_SHA||'';fs.writeFileSync('dist/version.json',JSON.stringify({commit:sha.slice(0,7),commitMessage:(process.env.COMMIT_MESSAGE||'').split('\n')[0],deployedAt:new Date().toISOString()}))"

      # GET /api/superadmin/health reads this to show the dependency-vulnerability count. `npm audit` exits
      # non-zero when it finds something, so its result is captured and the step never fails the deploy.
      - name: Record Dependency Audit
        run: |
          npm audit --omit=dev --json > audit-raw.json || true
          node -e "const fs=require('fs');let v={};try{v=JSON.parse(fs.readFileSync('audit-raw.json','utf8')).metadata.vulnerabilities||{}}catch(e){}const n=k=>Number(v[k])||0;if(typeof v.total==='number'){fs.writeFileSync('dist/audit.json',JSON.stringify({total:n('total'),critical:n('critical'),high:n('high'),checkedAt:new Date().toISOString()}))}"

      # PM2 runs the app from APP_DIR (script /root/Onboarding-backend/dist/server.js), NOT from
      # this runner workspace, so the fresh build has to be copied there. Copy only (no delete):
      # APP_DIR holds files that are not in git (.env, dist/config/firebase/serviceAccountKey.json).
      - name: Publish Build To Live App Folder
        env:
          APP_DIR: /root/Onboarding-backend
        run: |
          set -e
          test -f "$APP_DIR/dist/server.js"
          rm -rf "$APP_DIR/dist.bak"
          cp -a "$APP_DIR/dist" "$APP_DIR/dist.bak"
          cp -a dist/. "$APP_DIR/dist/"
          cp package.json package-lock.json "$APP_DIR/"
          cd "$APP_DIR"
          npm ci --omit=dev

      - name: Restart PM2 Service
        run: pm2 restart onboarding-backend

      - name: Verify Live Version
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT="${COMMIT_SHA:0:7}"
          URL="http://127.0.0.1:${PORT:-5000}/"
          for i in 1 2 3 4 5 6 7 8; do
            sleep 5
            if curl -fsS "$URL" | grep -q "$SHORT"; then
              echo "Live backend reports commit $SHORT"
              exit 0
            fi
          done
          echo "Live backend does NOT report commit $SHORT. It answered:"
          curl -sS "$URL" || true
          exit 1
